<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏛️ Congresso — Luciano da Luz 4090</title>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/highcharts.js"></script>
<style>
:root { --primary:#3B1E6D; --accent:#F27C38; --dark-bg:#0f0520; --card-bg:#1e0e3e; --card-border:#4a2480; --text:#f0e6ff; --muted:#9b8ab8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--dark-bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
nav { background:var(--primary); padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:60px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,.4); }
.nav-brand { font-weight:800; font-size:1.1rem; } .nav-brand span { color:var(--accent); font-size:1.3rem; }
.nav-links { display:flex; gap:4px; }
.nav-links a { color:var(--text); text-decoration:none; padding:8px 14px; border-radius:8px; font-size:.85rem; font-weight:500; transition:all .2s; }
.nav-links a:hover,.nav-links a.active { background:rgba(242,124,56,.2); color:var(--accent); }
.container { max-width:1200px; margin:0 auto; padding:24px 16px; }
h1 { font-size:1.5rem; margin-bottom:8px; } h1 span { color:var(--accent); }
.subtitle { color:var(--muted); font-size:.9rem; margin-bottom:24px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px; }
.stat { background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; padding:16px; text-align:center; }
.stat-val { font-size:1.8rem; font-weight:800; color:var(--accent); }
.stat-lbl { font-size:.75rem; color:var(--muted); text-transform:uppercase; margin-top:4px; }
.charts-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
.chart-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; padding:20px; }
.chart-card h3 { font-size:.95rem; margin-bottom:12px; }
.search-box { width:100%; padding:10px 16px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; color:var(--text); font-size:.9rem; margin-bottom:16px; outline:none; }
.search-box:focus { border-color:var(--accent); }
.prop-list { display:flex; flex-direction:column; gap:10px; }
.prop { background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; padding:16px; transition:border-color .2s; }
.prop:hover { border-color:var(--accent); }
.prop-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
.prop-tipo { background:var(--primary); color:var(--accent); padding:4px 10px; border-radius:6px; font-size:.75rem; font-weight:700; }
.prop-relevante { background:rgba(242,124,56,.2); color:var(--accent); padding:4px 10px; border-radius:6px; font-size:.7rem; font-weight:700; }
.prop-data { color:var(--muted); font-size:.75rem; }
.prop-ementa { font-size:.85rem; line-height:1.5; margin-bottom:8px; }
.prop-tags { display:flex; gap:6px; flex-wrap:wrap; }
.tag { background:rgba(59,30,109,.5); color:var(--muted); padding:2px 8px; border-radius:4px; font-size:.7rem; }
.prop-link { color:var(--accent); text-decoration:none; font-size:.8rem; font-weight:600; }
.prop-link:hover { text-decoration:underline; }
.footer { text-align:center; padding:24px; color:var(--muted); font-size:.75rem; margin-top:32px; border-top:1px solid var(--card-border); }
@media(max-width:768px) { .nav-links{display:none;} .charts-row{grid-template-columns:1fr;} }
</style>
</head>
<body>
<nav>
  <div class="nav-brand">LUCIANO DA LUZ <span>4090</span></div>
  <div class="nav-links">
    <a href="index.html">Central</a><a href="redes.html">QG Redes</a>
    <a href="congresso.html" class="active">Congresso</a><a href="votar.html">Proposições</a>
    <a href="votos.html">Controle</a><a href="analytics.html">Analytics</a>
  </div>
</nav>
<div class="container">
  <h1>🏛️ Congresso — <span>Proposições em Tramitação</span></h1>
  <p class="subtitle" id="lastUpdate">Carregando proposições da Câmara dos Deputados...</p>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="sTotal">—</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-val" id="sRelevantes">—</div><div class="stat-lbl">Relevantes</div></div>
    <div class="stat"><div class="stat-val" id="sPL">—</div><div class="stat-lbl">PL</div></div>
    <div class="stat"><div class="stat-val" id="sPEC">—</div><div class="stat-lbl">PEC</div></div>
  </div>

  <div class="charts-row">
    <div class="chart-card"><h3>Por Tipo</h3><div id="chartTipo" style="height:240px"></div></div>
    <div class="chart-card"><h3>Temas Encontrados</h3><div id="chartTemas" style="height:240px"></div></div>
  </div>

  <input type="text" class="search-box" id="searchBox" placeholder="🔍 Buscar por tipo, número, ementa, tema...">
  <div class="prop-list" id="propList"></div>
</div>
<div class="footer">Dados: dadosabertos.camara.leg.br · Auto-refresh 5 min</div>

<script>
const SHEET_ID = '1hvjOH_TJvsom0RZV_ocwTAA-KPqTiZY54b6JRe7WggI';
const SHEET_NAME = 'PROPOSICOES';
let allProps = [];

function val(r,i) { return r.c&&r.c[i]?(r.c[i].v||''):''; }

function render() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const filtered = allProps.filter(p => {
    if(!q) return true;
    return [p.tipo,p.numero,p.ementa,p.temas].join(' ').toLowerCase().includes(q);
  });
  document.getElementById('propList').innerHTML = filtered.slice(0,100).map(p => {
    const tags = (p.temas||'').split(',').filter(t=>t.trim()).map(t=>`<span class="tag">${t.trim()}</span>`).join('');
    const relevBadge = (p.relevante||'').toUpperCase()==='SIM' ? '<span class="prop-relevante">🎯 RELEVANTE</span>' : '';
    const link = p.id ? `https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao=${p.id}` : '#';
    return `<div class="prop">
      <div class="prop-header">
        <div><span class="prop-tipo">${p.tipo} ${p.numero}/${p.ano}</span> ${relevBadge}</div>
        <span class="prop-data">${p.data}</span>
      </div>
      <div class="prop-ementa">${p.ementa}</div>
      <div class="prop-tags">${tags}</div>
      <a class="prop-link" href="${link}" target="_blank">Ver na Câmara →</a>
    </div>`;
  }).join('');
}

async function loadData() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
    const text = await fetch(url).then(r=>r.text());
    const json = JSON.parse(text.substring(47).slice(0,-2));
    const rows = json.table.rows||[];

    allProps = rows.map(r => ({
      id: val(r,0), tipo: val(r,1), numero: val(r,2), ano: val(r,3),
      ementa: val(r,4), data: val(r,5), autores: val(r,6), status: val(r,7),
      relevante: val(r,8), temas: val(r,9)
    }));

    const total = allProps.length;
    const relevantes = allProps.filter(p=>(p.relevante||'').toUpperCase()==='SIM').length;
    const pl = allProps.filter(p=>(p.tipo||'').toUpperCase()==='PL').length;
    const pec = allProps.filter(p=>(p.tipo||'').toUpperCase()==='PEC').length;

    document.getElementById('sTotal').textContent = total;
    document.getElementById('sRelevantes').textContent = relevantes;
    document.getElementById('sPL').textContent = pl;
    document.getElementById('sPEC').textContent = pec;
    document.getElementById('lastUpdate').textContent = `${total} proposições · Atualizado: ${new Date().toLocaleString('pt-BR')}`;

    // Tipo chart
    const tipoMap = {};
    allProps.forEach(p=>{ const t=p.tipo||'Outro'; tipoMap[t]=(tipoMap[t]||0)+1; });
    Highcharts.chart('chartTipo', {
      chart:{type:'bar',backgroundColor:'transparent'},title:{text:null},
      xAxis:{categories:Object.keys(tipoMap),labels:{style:{color:'#9b8ab8'}}},
      yAxis:{title:{text:null},labels:{style:{color:'#9b8ab8'}},gridLineColor:'rgba(74,36,128,.3)'},
      series:[{name:'Proposições',data:Object.values(tipoMap),color:'#F27C38'}],
      legend:{enabled:false},credits:{enabled:false},
      plotOptions:{bar:{borderRadius:4,borderWidth:0}}
    });

    // Temas chart
    const temaMap = {};
    allProps.forEach(p=>{ (p.temas||'').split(',').forEach(t=>{ t=t.trim(); if(t) temaMap[t]=(temaMap[t]||0)+1; }); });
    const temaEntries = Object.entries(temaMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
    if(temaEntries.length) {
      Highcharts.chart('chartTemas', {
        chart:{type:'bar',backgroundColor:'transparent'},title:{text:null},
        xAxis:{categories:temaEntries.map(e=>e[0]),labels:{style:{color:'#9b8ab8',fontSize:'11px'}}},
        yAxis:{title:{text:null},labels:{style:{color:'#9b8ab8'}},gridLineColor:'rgba(74,36,128,.3)'},
        series:[{name:'Ocorrências',data:temaEntries.map(e=>e[1]),color:'#3B1E6D'}],
        legend:{enabled:false},credits:{enabled:false},
        plotOptions:{bar:{borderRadius:4,borderWidth:0}}
      });
    }
    render();
  } catch(e) { document.getElementById('lastUpdate').textContent='Erro: '+e.message; }
}

document.getElementById('searchBox').addEventListener('input', render);
loadData();
setInterval(loadData,300000);
</script>
</body>
</html>
