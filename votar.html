<style>
:root { --primary:#3B1E6D; --accent:#F27C38; --dark-bg:#0f0520; --card-bg:#1e0e3e; --card-border:#4a2480; --text:#f0e6ff; --muted:#9b8ab8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--dark-bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
nav { background:var(--primary); padding:0 16px; display:flex; align-items:center; justify-content:space-between; height:56px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,.4); }
.nav-brand { font-weight:800; font-size:.95rem; } .nav-brand .num { color:var(--accent); font-size:1.15rem; }
.nav-links { display:flex; gap:2px; overflow-x:auto; }
.nav-links a { color:var(--text); text-decoration:none; padding:8px 10px; border-radius:8px; font-size:.78rem; font-weight:500; transition:all .2s; white-space:nowrap; min-height:44px; display:flex; align-items:center; }
.nav-links a:hover,.nav-links a.active { background:rgba(242,124,56,.2); color:var(--accent); }
.container { max-width:1200px; margin:0 auto; padding:20px 14px; }
h1 { font-size:1.4rem; margin-bottom:6px; } h1 span { color:var(--accent); }
.subtitle { color:var(--muted); font-size:.85rem; margin-bottom:20px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.filters button { background:var(--card-bg); border:1px solid var(--card-border); color:var(--text); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:.82rem; transition:all .2s; min-height:44px; }
.filters button:hover,.filters button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.search-box { width:100%; padding:10px 16px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; color:var(--text); font-size:.9rem; margin-bottom:14px; outline:none; }
.search-box:focus { border-color:var(--accent); }
.table-wrap { overflow-x:auto; border-radius:12px; border:1px solid var(--card-border); }
table { width:100%; border-collapse:collapse; font-size:.82rem; }
thead { background:var(--primary); }
th { padding:12px 10px; text-align:left; font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; }
td { padding:10px; border-bottom:1px solid rgba(74,36,128,.3); }
tr:hover td { background:rgba(59,30,109,.3); }
.badge-rel { background:rgba(242,124,56,.2); color:var(--accent); padding:3px 8px; border-radius:6px; font-size:.7rem; font-weight:700; }
.tag { display:inline-block; background:rgba(59,30,109,.5); color:var(--muted); padding:2px 6px; border-radius:4px; font-size:.68rem; margin:1px 2px; }
a.link { color:var(--accent); text-decoration:none; font-weight:600; } a.link:hover { text-decoration:underline; }
.footer { text-align:center; padding:20px; color:var(--muted); font-size:.72rem; margin-top:24px; border-top:1px solid var(--card-border); }
@media(max-width:768px) { .nav-links a{padding:6px 8px;font-size:.68rem;} }
</style>
</head>

<script>
var SHEET_ID='1hvjOH_TJvsom0RZV_ocwTAA-KPqTiZY54b6JRe7WggI';
var allProps=[],currentFilter='TODOS';
var KEYWORDS_RELEVANCIA=['educacao','educação','saude','saúde','periferia','agroecologia','infra','infraestrutura','fiscalizacao','fiscalização','escola','sus','moradia','saneamento','transporte','agricultura familiar','juventude','cultura'];
function val(r,i){return r.c&&r.c[i]?(r.c[i].v||''):'';}
function fmtDate(v){
  if(!v) return '--';
  var s=String(v),m=s.match(/^Date\((\d+),(\d+),(\d+)/);
  if(m){var dd=String(m[3]).padStart(2,'0'),mm=String(Number(m[2])+1).padStart(2,'0');return dd+'/'+mm+'/'+m[1];}
  if(s.length>=10) return s.substring(8,10)+'/'+s.substring(5,7)+'/'+s.substring(0,4);
  return s.substring(0,10);
}
function checkRelevante(ementa){
  if(!ementa) return false;
  var low=ementa.toLowerCase();
  for(var i=0;i<KEYWORDS_RELEVANCIA.length;i++){
    if(low.indexOf(KEYWORDS_RELEVANCIA[i])>=0) return true;
  }
  return false;
}

function render(){
  var q=document.getElementById('searchBox').value.toLowerCase();
  var filtered=allProps.filter(function(p){
    if(currentFilter==='RELEVANTE'&&!p.relevante) return false;
    if(['PL','PEC','PLP'].indexOf(currentFilter)>=0&&(p.tipo||'').toUpperCase()!==currentFilter) return false;
    if(q) return [p.tipo,p.numero,p.ano,p.ementa,p.status].join(' ').toLowerCase().indexOf(q)>=0;
    return true;
  });
  document.getElementById('tbody').innerHTML=filtered.slice(0,200).map(function(p){
    var statusTag=p.status?'<span class="tag">'+p.status+'</span>':'';
    var rel=p.relevante?'<span class="badge-rel">\ud83d\udd25 Relevante</span>':'--';
    var link=p.id?'https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao='+p.id:'#';
    return '<tr><td style="font-weight:600">'+(p.tipo||'--')+'</td><td>'+p.numero+'/'+p.ano+'</td><td style="max-width:400px">'+(p.ementa||'--')+'</td><td style="white-space:nowrap">'+(p.data||'--')+'</td><td>'+statusTag+'</td><td style="text-align:center">'+rel+'</td><td><a class="link" href="'+link+'" target="_blank">Ver \u2192</a></td></tr>';
  }).join('');
}

function loadData(){
  var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&sheet=PROPOSICOES';
  fetch(url).then(function(r){return r.text();}).then(function(text){
    var rows=JSON.parse(text.substring(47).slice(0,-2)).table.rows||[];
    allProps=rows.map(function(r){
      var ementa=String(val(r,4));
      return {id:val(r,0),tipo:String(val(r,1)).toUpperCase(),numero:val(r,2),ano:val(r,3),ementa:ementa,data:fmtDate(val(r,5)),status:String(val(r,7)),relevante:checkRelevante(ementa)};
    }).filter(function(p){return p.tipo&&p.numero;});

    document.getElementById('lastUpdate').textContent=allProps.length+' proposicoes carregadas \u00b7 '+new Date().toLocaleString('pt-BR');
    render();
  }).catch(function(e){
    document.getElementById('lastUpdate').textContent='Erro: '+e.message;
  });
}

document.getElementById('filters').addEventListener('click',function(e){
  if(e.target.tagName!=='BUTTON') return;
  var btns=document.querySelectorAll('.filters button');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  e.target.classList.add('active');
  currentFilter=e.target.getAttribute('data-filter');
  render();
});
document.getElementById('searchBox').addEventListener('input',render);
loadData();
setInterval(loadData,300000);
</script>
