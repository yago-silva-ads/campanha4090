<style>
:root { --primary:#3B1E6D; --accent:#F27C38; --dark-bg:#0f0520; --card-bg:#1e0e3e; --card-border:#4a2480; --text:#f0e6ff; --muted:#9b8ab8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--dark-bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
nav { background:var(--primary); padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:60px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,.4); }

.nav-avatar { width:40px; height:40px; border-radius:50%; border:2px solid var(--accent); object-fit:cover; }
.nav-brand { font-weight:800; font-size:1.1rem; } .nav-brand span { color:var(--accent); font-size:1.3rem; }
.nav-links { display:flex; gap:4px; }
.nav-links a { color:var(--text); text-decoration:none; padding:8px 14px; border-radius:8px; font-size:.85rem; font-weight:500; transition:all .2s; }
.nav-links a:hover,.nav-links a.active { background:rgba(242,124,56,.2); color:var(--accent); }
.container { max-width:1200px; margin:0 auto; padding:24px 16px; }
h1 { font-size:1.5rem; margin-bottom:8px; } h1 span { color:var(--accent); }
.subtitle { color:var(--muted); font-size:.9rem; margin-bottom:24px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }

.filters button:hover,.filters button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.search-box { width:100%; padding:10px 16px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; color:var(--text); font-size:.9rem; margin-bottom:16px; outline:none; }
.search-box:focus { border-color:var(--accent); }
.table-wrap { overflow-x:auto; border-radius:12px; border:1px solid var(--card-border); }
table { width:100%; border-collapse:collapse; font-size:.82rem; }
thead { background:var(--primary); }
th { padding:12px 10px; text-align:left; font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.5px; }

  <div style="text-align:center;max-width:360px;padding:32px;background:#1e0e3e;border-radius:20px;border:1px solid #4a2480;box-shadow:0 8px 32px rgba(0,0,0,.6);">

    <div id="authErr" style="color:#ef4444;font-size:.78rem;margin-top:10px;display:none;">Senha incorreta</div>
  </div>
</div>
<script>
function checkAuth(){var p=document.getElementById('authPwd').value;if(p==='luciano4090'){sessionStorage.setItem('auth_campanha4090','1');document.getElementById('authGate').style.display='none';}else{document.getElementById('authErr').style.display='block';document.getElementById('authPwd').value='';document.getElementById('authPwd').style.borderColor='#ef4444';setTimeout(function(){document.getElementById('authPwd').style.borderColor='#4a2480';document.getElementById('authErr').style.display='none';},2000);}}
if(sessionStorage.getItem('auth_campanha4090')==='1'){document.getElementById('authGate').style.display='none';}
</script>

<div class="container">
  <h1>📋 Proposições — <span>Tabela Completa</span></h1>
  <p class="subtitle" id="lastUpdate">Carregando...</p>

  <div class="filters" id="filters">
    <button class="active" data-filter="TODOS">Todos</button>
    <button data-filter="RELEVANTE">🎯 Relevantes</button>
    <button data-filter="PL">PL</button>
    <button data-filter="PEC">PEC</button>
    <button data-filter="PLP">PLP</button>
  </div>

  <input type="text" class="search-box" id="searchBox" placeholder="🔍 Buscar por tipo, número, ementa...">

  <div class="table-wrap">
    <table>
      <thead><tr><th>Tipo</th><th>Nº/Ano</th><th>Ementa</th><th>Data</th><th>Temas</th><th>Relevante</th><th>Link</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<div class="footer">Dados: dadosabertos.camara.leg.br · Auto-refresh 5 min</div>

<script>
const SHEET_ID = '1hvjOH_TJvsom0RZV_ocwTAA-KPqTiZY54b6JRe7WggI';
let allProps = [], currentFilter = 'TODOS';
function val(r,i){return r.c&&r.c[i]?(r.c[i].v||''):'';}

function render() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const filtered = allProps.filter(p => {
    if(currentFilter==='RELEVANTE' && (p.relevante||'').toUpperCase()!=='SIM') return false;
    if(['PL','PEC','PLP'].includes(currentFilter) && (p.tipo||'').toUpperCase()!==currentFilter) return false;
    if(q) return [p.tipo,p.numero,p.ano,p.ementa,p.temas].join(' ').toLowerCase().includes(q);
    return true;
  });
  document.getElementById('tbody').innerHTML = filtered.slice(0,200).map(p => {
    const tags = (p.temas||'').split(',').filter(t=>t.trim()).map(t=>`<span class="tag">${t.trim()}</span>`).join('');
    const rel = (p.relevante||'').toUpperCase()==='SIM' ? '<span class="badge-rel">🎯 SIM</span>' : '—';
    const link = p.id ? `https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao=${p.id}` : '#';
    return `<tr>
      <td style="font-weight:600">${p.tipo||'—'}</td>
      <td>${p.numero}/${p.ano}</td>
      <td style="max-width:400px">${p.ementa||'—'}</td>
      <td style="white-space:nowrap">${p.data||'—'}</td>
      <td>${tags||'—'}</td>
      <td style="text-align:center">${rel}</td>
      <td><a class="link" href="${link}" target="_blank">Ver →</a></td>
    </tr>`;
  }).join('');
}

async function loadData() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=PROPOSICOES`;
    const text = await fetch(url).then(r=>r.text());
    const json = JSON.parse(text.substring(47).slice(0,-2));
    allProps = (json.table.rows||[]).map(r=>({
      id:val(r,0),tipo:val(r,1),numero:val(r,2),ano:val(r,3),
      ementa:val(r,4),data:val(r,5),autores:val(r,6),status:val(r,7),
      relevante:val(r,8),temas:val(r,9)
    }));
    document.getElementById('lastUpdate').textContent = `${allProps.length} proposições · Atualizado: ${new Date().toLocaleString('pt-BR')}`;
    render();
  } catch(e) { document.getElementById('lastUpdate').textContent='Erro: '+e.message; }
}

document.getElementById('filters').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter=e.target.dataset.filter;
  render();
});
document.getElementById('searchBox').addEventListener('input',render);
loadData(); setInterval(loadData,300000);
</script>
